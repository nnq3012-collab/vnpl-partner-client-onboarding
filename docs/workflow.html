<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VNPL Partner Approval Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --ink:#1C2430; --muted:#5D6875; --grid:#D3D9E0;
  --it-f:#ECEFF3; --it-s:#7A8796;
  --req-f:#FFF3CC; --req-s:#C9981E;
  --fin-f:#EFE7F7; --fin-s:#8B6BB8;
  --legal-f:#E3ECF9; --legal-s:#4F7CC0;
  --appr-f:#FBE8E4; --appr-s:#C4624F;
  --exp-f:#E2F2E6; --exp-s:#4E9A62;
  --sota-f:#E4EEF5; --sota-s:#5A8FB0;
  --e-normal:#3B4654; --e-ok:#2F8A4E; --e-chg:#C9710C; --e-rej:#C43D3D; --e-data:#8A94A0;
  --rej-f:#FCE9E9;
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11161C; --surface:#1A2129; --ink:#E4E9EF; --muted:#9AA6B3; --grid:#2E3844;
    --it-f:#232B35; --it-s:#8C99A8; --req-f:#3A3116; --req-s:#E0B84A; --fin-f:#2E2540; --fin-s:#B597E0;
    --legal-f:#1F2D44; --legal-s:#7FA6E0; --appr-f:#3C2320; --appr-s:#E08A76; --exp-f:#1D3526; --exp-s:#6CC088;
    --sota-f:#1C2F3D; --sota-s:#7FB2D3;
    --e-normal:#C3CBD5; --e-ok:#5CC27E; --e-chg:#F0A040; --e-rej:#F07070; --e-data:#7E8A97; --rej-f:#3A1E1E;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11161C; --surface:#1A2129; --ink:#E4E9EF; --muted:#9AA6B3; --grid:#2E3844;
  --it-f:#232B35; --it-s:#8C99A8; --req-f:#3A3116; --req-s:#E0B84A; --fin-f:#2E2540; --fin-s:#B597E0;
  --legal-f:#1F2D44; --legal-s:#7FA6E0; --appr-f:#3C2320; --appr-s:#E08A76; --exp-f:#1D3526; --exp-s:#6CC088;
  --sota-f:#1C2F3D; --sota-s:#7FB2D3;
  --e-normal:#C3CBD5; --e-ok:#5CC27E; --e-chg:#F0A040; --e-rej:#F07070; --e-data:#7E8A97; --rej-f:#3A1E1E;
}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:28px 48px;display:grid;gap:24px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
h1{font-size:26px;line-height:1.2;margin:0;font-weight:700;text-wrap:balance}
.lede{margin:6px 0 0;color:var(--muted);max-width:68ch}
.controls{display:flex;gap:8px;flex-wrap:wrap}
button{font:500 13px var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--grid);border-radius:6px;padding:6px 12px;cursor:pointer}
button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--legal-s);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:12.5px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.stage{background:var(--surface);border:1px solid var(--grid);border-radius:10px;overflow-x:auto}
.stage svg{display:block}
.stage.fit svg{width:100%;height:auto}
.hint{font-size:12px;color:var(--muted);margin:-14px 0 0}
h2{font-size:18px;margin:0 0 12px}
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.role{background:var(--surface);border:1px solid var(--grid);border-top:4px solid var(--c);border-radius:8px;padding:14px 16px}
.role h3{margin:0;font-size:15px}
.role .who{font:12px var(--mono);color:var(--muted);margin:2px 0 8px}
.role ul{margin:0;padding-left:18px;display:grid;gap:4px}
.rules{background:var(--surface);border:1px solid var(--grid);border-radius:8px;padding:14px 16px}
.rules ul{margin:0;padding-left:18px;display:grid;gap:4px}
.mono{font-family:var(--mono);font-size:.92em}
</style>

<div class="wrap">
  <header>
    <div>
      <h1 id="h1"></h1>
      <p class="lede" id="lede"></p>
    </div>
    <div class="controls">
      <button id="b-vi" type="button">Tiếng Việt</button>
      <button id="b-en" type="button">English</button>
      <button id="b-fit" type="button"></button>
    </div>
  </header>

  <div class="legend" id="legend"></div>
  <div class="stage" id="stage"></div>

    <h2 id="h-roles"></h2>
    <div class="roles" id="roles"></div>
  </section>

  <section class="rules">
    <h2 id="h-rules"></h2>
    <ul id="rules"></ul>
  </section>
</div>

];

const STYLE = {
  null:{c:'--e-normal'}, ok:{c:'--e-ok'}, chg:{c:'--e-chg',d:'6 4'}, 'chg-join':{c:'--e-chg',d:'6 4',noArrow:true},

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function lines(cx, cy, title, sub) {
  const tl = T(title).split('\n'), sl = sub ? T(sub).split('\n') : [];
  const total = tl.length*15 + sl.length*13 + (sl.length ? 2 : 0);
  let y = cy - total/2 + 11, out = '';
  tl.forEach(l => { out += `<text x="${cx}" y="${y}" text-anchor="middle" font-size="12.5" font-weight="600" fill="var(--ink)">${esc(l)}</text>`; y += 15; });
  y += 2;
  sl.forEach(l => { out += `<text x="${cx}" y="${y}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${esc(l)}</text>`; y += 13; });
  return out;
}

function svg() {
  let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(T(UI.h1))}" font-family="Be Vietnam Pro, system-ui, sans-serif"><defs>`;
  for (const k of ['--e-normal','--e-ok','--e-chg','--e-rej','--e-data'])
    s += `<marker id="m${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(${k})"/></marker>`;
  s += `</defs><rect width="${W}" height="${H}" fill="var(--surface)"/>`;
  for (const L of LANES) {
    s += `<rect x="0" y="${L.y}" width="${LW}" height="${L.h}" fill="var(--${L.id}-f)"/>`;
    s += `<line x1="0" x2="${W}" y1="${L.y+L.h}" y2="${L.y+L.h}" stroke="var(--grid)"/>`;
    s += `<text x="16" y="${L.y+L.h/2-2}" font-size="14" font-weight="700" fill="var(--ink)">${esc(T(L.n))}</text>`;
    s += `<text x="16" y="${L.y+L.h/2+15}" font-size="10.5" font-family="JetBrains Mono, monospace" fill="var(--muted)">${esc(T(L.w))}</text>`;
  }
  s += `<line x1="${LW}" x2="${LW}" y1="0" y2="${H}" stroke="var(--grid)"/>`;

  for (const [pts, st, label, lx, ly, anchor] of E) {
    const S = STYLE[st ?? null];
    s += `<path d="M${pts.map(p => p.join(' ')).join('L')}" fill="none" stroke="var(${S.c})" stroke-width="1.6"${S.d ? ` stroke-dasharray="${S.d}"` : ''}${S.noArrow ? '' : ` marker-end="url(#m${S.c})"`}/>`;
    if (label) s += `<text x="${lx}" y="${ly}" text-anchor="${anchor}" font-size="10.5" font-weight="500" fill="var(${S.c})" stroke="var(--surface)" stroke-width="4" paint-order="stroke">${esc(T(label))}</text>`;
  }

  for (const n of N) {
    const f = n.l ? `var(--${n.l}-f)` : 'var(--surface)', st = n.l ? `var(--${n.l}-s)` : 'var(--ink)';
    const dash = n.auto ? ' stroke-dasharray="5 3"' : '';
    if (n.shape === 'bar') {
      s += `<rect x="${n.x-5}" y="${n.y-n.h/2}" width="10" height="${n.h}" rx="2" fill="var(--e-normal)"/>`;
      s += `<text x="${n.x+10}" y="${n.y-n.h/2-8}" font-size="10.5" font-weight="600" fill="var(--muted)">${esc(T(n.cap))}</text>`;
    } else if (n.shape === 'note') {
      T(n.t).split('\n').forEach((l, i) => { s += `<text x="${n.x}" y="${n.y+i*13}" text-anchor="end" font-size="10.5" fill="var(--muted)">${esc(l)}</text>`; });
    } else if (n.shape === 'start') {
      s += `<ellipse cx="${n.x}" cy="${n.y}" rx="55" ry="30" fill="${f}" stroke="${st}" stroke-width="1.5"/>` + lines(n.x, n.y, n.t);
    } else if (n.shape === 'diamond') {
      s += `<polygon points="${n.x},${n.y-36} ${n.x+48},${n.y} ${n.x},${n.y+36} ${n.x-48},${n.y}" fill="${f}" stroke="${st}" stroke-width="1.5"${dash}/>`;
      s += lines(n.x, n.y, n.t).replace(/font-size="12.5"/g, 'font-size="11"');
    } else if (n.shape === 'reject' || n.shape === 'chip') {
      const w = n.w || 96, h = n.h || 26, t = n.t || {vi:'✕ Từ chối',en:'✕ Rejected'};
      s += `<rect x="${n.x-w/2}" y="${n.y-h/2}" width="${w}" height="${h}" rx="${h/2}" fill="var(--rej-f)" stroke="var(--e-rej)" stroke-width="1.3"/>`;
      s += `<text x="${n.x}" y="${n.y+4}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--e-rej)">${esc(T(t))}</text>`;
    } else if (n.shape === 'state') {
      s += `<rect x="${n.x-75}" y="${n.y-n.h/2}" width="150" height="${n.h}" rx="22" fill="var(--exp-f)" stroke="var(--e-ok)" stroke-width="2.2"/>` + lines(n.x, n.y, n.t);
    } else {
      const w = 150, h = n.h || 56;
      s += `<rect x="${n.x-w/2}" y="${n.y-h/2}" width="${w}" height="${h}" rx="7" fill="${f}" stroke="${st}" stroke-width="1.5"${dash}/>` + lines(n.x, n.y, n.t, n.s);
      if (n.tag) s += `<text x="${n.x-w/2+2}" y="${n.y-h/2-7}" font-size="10" font-family="JetBrains Mono, monospace" fill="${st}">● ${esc(T(n.tag))}</text>`;
    }
  }
  return s + '</svg>';
}

const $ = id => document.getElementById(id);
function render() {
  document.documentElement.lang = lang;
  $('h1').textContent = T(UI.h1);
  $('lede').textContent = T(UI.lede);
  $('hint').textContent = T(UI.hint);
  $('h-roles').textContent = T(UI.roles);
  $('h-rules').textContent = T(UI.rules);
  $('b-fit').textContent = T(fit ? UI.fitOff : UI.fitOn);
  $('b-vi').setAttribute('aria-pressed', lang === 'vi');
  $('b-en').setAttribute('aria-pressed', lang === 'en');
  $('stage').classList.toggle('fit', fit);
  $('stage').innerHTML = svg();
  $('legend').innerHTML = LEGEND.map(([ic, t]) => `<span>${ic}${esc(T(t))}</span>`).join('');
  $('roles').innerHTML = ROLES.map(r => `<article class="role" style="--c:var(${r.c})"><h3>${esc(T(r.n))}</h3><div class="who">${esc(T(r.w))}</div><ul>${r.s.map(x => `<li>${esc(T(x))}</li>`).join('')}</ul></article>`).join('');
  $('rules').innerHTML = RULES.map(x => `<li>${esc(T(x))}</li>`).join('');
}
function setLang(l) { lang = l; try { localStorage.setItem('flow-lang', l); } catch (e) {} render(); }
$('b-vi').onclick = () => setLang('vi');
$('b-en').onclick = () => setLang('en');
$('b-fit').onclick = () => { fit = !fit; render(); };
render();
</script>
