services:
  - type: web
    name: vnpl-partner-onboarding
    runtime: python
    region: singapore
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py seed $SEED_ARGS
    startCommand: gunicorn config.wsgi
    envVars:
      - key: DATABASE_URL
        sync: false # paste the Neon connection string in the Render dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: SEED_ARGS
        value: "--demo" # UAT only: creates demo users. Set to empty for production.
